<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>VERIFICADOR DE IDADE</h1>
    </header>
    <section>
        <div>
           <p>Ano de nascimento:
             <input type="number" name="txtano" id="txtano" min="00">
           </p>
           <p>Sexo:
             <input type="radio" name="radsex" id="masculino" checked>
             <label for="masculino">Masculino</label>
             <input type="radio" name="radsex" id="feminino">
             <label for="feminino">Feminino</label>
           </p>
           <p>
            <input class="btn" type="button" value="Verificar" onclick="verificar()">
           </p>
        </div>
        <div id = "res">
            Preencha os dados acima para ver o resultado!
        </div>
    </section>
    <footer>
        <p>&copy; 2026 MeuSite</p>
    </footer>

</html>
